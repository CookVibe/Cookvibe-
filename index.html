<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CookVibe • Access</title>
<meta http-equiv="Cache-Control" content="no-store"/>

<style>
:root{
  --g:#1fbf7a;
  --y:#d9b75f;
  --text:#121212;
  --muted:#55635e;
  --line:rgba(0,0,0,.10);
  --shadow:0 14px 34px rgba(0,0,0,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  color:var(--text);
  background:
    radial-gradient(1200px 700px at 10% 0%, rgba(255,186,73,.28), transparent 55%),
    radial-gradient(1100px 700px at 90% 5%, rgba(31,191,122,.20), transparent 55%),
    linear-gradient(180deg,#fff6e6 0%,#ffffff 60%,#f5fff9 100%);
}
.wrap{max-width:1100px;margin:0 auto;padding:24px 14px 60px}
.card{
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  box-shadow:var(--shadow);
}
.row{display:flex;gap:14px;align-items:center}
.small{font-size:12px;color:var(--muted)}
.btn{
  padding:12px 18px;border-radius:14px;border:0;
  cursor:pointer;font-weight:900;
  background:linear-gradient(135deg,var(--g),var(--y));
}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc}

.logoBox{
  width:60px;height:60px;border-radius:18px;
  border:1px solid rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;
  background:#000;
}
.logoBox svg{width:50px;height:50px}

.foodGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-top:16px;
}
.foodGrid img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:16px;
  border:1px solid rgba(0,0,0,.10);
}
.earn{
  margin-top:18px;
  border-radius:18px;
  padding:16px;
  background:rgba(31,191,122,.08);
  border:1px solid rgba(31,191,122,.25);
}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">

    <div class="row">
      <div class="logoBox">
        <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
          <rect width="500" height="500" fill="#000"/>
          <text x="50%" y="55%" text-anchor="middle"
            font-family="Arial, Helvetica, sans-serif"
            font-size="96" font-weight="bold">
            <tspan fill="#2E7D32">Cook</tspan>
            <tspan fill="#C9A227">vibe</tspan>
          </text>
        </svg>
      </div>
      <div>
        <div style="font-weight:1000">CookVibe</div>
        <div class="small">Access required</div>
      </div>
    </div>

    <h1>CookVibe demo is live — help shape it.</h1>
    <p>A global cooking platform built for creators.</p>

    <!-- FOOD ONLY (IMAGES THAT WORK) -->
    <div class="foodGrid">
      <!-- Seafood (ONE) -->
      <img src="https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=800&q=80" alt="Seafood">

      <!-- Meals -->
      <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=800&q=80" alt="Paella">
      <img src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?auto=format&fit=crop&w=800&q=80" alt="Salad">

      <!-- ✅ REPLACED CURRY IMAGE (ONLY CHANGE) -->
      <img src="https://images.unsplash.com/photo-1600628422019-7a3f9f2b6b2d?auto=format&fit=crop&w=800&q=80" alt="Curry">

      <img src="https://images.unsplash.com/photo-1551218808-94e220e084d2?auto=format&fit=crop&w=800&q=80" alt="Sushi">
    </div>

    <div class="earn">
      <strong>How creators earn</strong>
      <ul>
        <li>Tips during live cooking</li>
        <li>Future subscriptions</li>
        <li>Early creator rewards</li>
      </ul>
    </div>

    <div style="margin-top:18px">
      <input id="code" placeholder="Enter access code"/>
      <div style="margin-top:12px">
        <button class="btn" onclick="enter()">Enter CookVibe</button>
      </div>
    </div>

  </div>
</div>

<script>
function enter(){
  const code=document.getElementById("code").value.trim();
  if(!code){ alert("Enter access code"); return; }
  localStorage.setItem("cv_role","creator");
  window.location.href="app.html";
}
</script>
</body>
</html>
