<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CookVibe • Access</title>
<meta http-equiv="Cache-Control" content="no-store"/>

<style>
:root{
  --g:#1fbf7a;
  --y:#d9b75f;
  --text:#121212;
  --muted:#55635e;
  --line:rgba(0,0,0,.10);
  --shadow:0 14px 34px rgba(0,0,0,.10);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(1200px 700px at 10% 0%, rgba(255,186,73,.28), transparent 55%),
    radial-gradient(1100px 700px at 90% 5%, rgba(31,191,122,.20), transparent 55%),
    linear-gradient(180deg,#fff6e6 0%,#ffffff 60%,#f5fff9 100%);
}

.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:24px;
  padding:28px;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
}

.logo{
  font-weight:1000;
  font-size:28px;
  margin-bottom:6px;
}

.sub{
  font-size:13px;
  color:var(--muted);
  margin-bottom:22px;
}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #ccc;
  margin-bottom:14px;
  font-size:14px;
}

.btn{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:0;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  background:linear-gradient(135deg,var(--g),var(--y));
  color:#ffffff;
}

.small{
  margin-top:14px;
  font-size:12px;
  text-align:center;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">CookVibe</div>
  <div class="sub">Creator access required</div>

  <input id="code" placeholder="Enter access code"/>
  <button class="btn" onclick="enter()">Enter CookVibe</button>

  <div class="small">
    Stage 1 Demo
  </div>

</div>

<script>
/* =========================
   COOKVIBE ACCESS GATE
   Whitelisted codes only
========================= */

const ACCESS = {
  ADMIN:      { role:"admin", admin:true },
  CORECIRCLE: { role:"admin", admin:true },
  DEV:        { role:"admin", admin:true },

  CREATOR:    { role:"creator" },
  VIBER:      { role:"viewer" }
};

function enter(){
  const raw = document.getElementById("code").value || "";
  const code = raw.trim().toUpperCase();

  if(!code){
    alert("Enter an access code");
    return;
  }

  const config = ACCESS[code];

  if(!config){
    alert("Invalid access code.");
    return;
  }

  localStorage.removeItem("cv_role");
  localStorage.removeItem("cv_admin");
  localStorage.removeItem("cv_founding");

  localStorage.setItem("cv_role", config.role);

  if(config.admin)
    localStorage.setItem("cv_admin","1");

  window.location.href="app.html";
}
</script>

</body>
</html>
