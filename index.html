<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CookVibe • Access</title>
<meta http-equiv="Cache-Control" content="no-store"/>

<style>
:root{
  --green:#1fbf7a;
  --gold:#d9b75f;
  --ink:#1a1a1a;
  --muted:#555;
  --card:rgba(255,255,255,.94);
  --shadow:0 18px 60px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(900px 500px at 10% 0%, rgba(31,191,122,.25), transparent 60%),
    radial-gradient(900px 500px at 90% 0%, rgba(217,183,95,.25), transparent 60%),
    linear-gradient(180deg,#fff4e6 0%, #f7fff9 40%, #eef6ff 100%);
}
.card{
  width:min(900px,96vw);
  background:var(--card);
  border-radius:28px;
  box-shadow:var(--shadow);
  padding:22px;
}
.top{
  display:flex;
  gap:16px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
}
.brand{
  display:flex;
  gap:14px;
  align-items:center;
}
.logo{
  width:56px;height:56px;
  border-radius:16px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 16px rgba(0,0,0,.15);
}
.brand h1{
  margin:0;
  font-size:24px;
  font-weight:900;
}
.brand p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:14px;
}
.badges{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.badge{
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  background:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}
.collage{
  margin-top:16px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:12px;
}
.collage img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:16px;
}
.form{
  margin-top:18px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
}
@media(max-width:640px){
  .form{grid-template-columns:1fr}
}
input{
  padding:14px;
  border-radius:14px;
  border:1px solid rgba(0,0,0,.2);
  font-size:15px;
}
button{
  padding:14px 16px;
  border-radius:14px;
  border:none;
  font-weight:900;
  cursor:pointer;
}
.primary{
  background:linear-gradient(135deg,var(--green),var(--gold));
  color:#000;
}
.secondary{
  background:#fff;
  border:1px solid rgba(0,0,0,.15);
}
.note{
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
}
.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:14px;
  background:#fff;
  padding:10px 14px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  display:none;
  font-weight:800;
}
.toast.show{display:block}

/* Mum easter egg */
.mum-note{
  position:fixed;
  right:12px;
  bottom:10px;
  font-size:11px;
  opacity:0.15;
  pointer-events:none;
}
@media(max-width:1200px){
  .mum-note{display:none}
}
</style>
</head>

<body>
<div class="toast" id="toast"></div>

<div class="card">
  <div class="top">
    <div class="brand">
      <div class="logo">
        <!-- Inline SVG logo (always loads) -->
        <svg width="44" height="44" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
          <rect width="500" height="500" fill="#fff"/>
          <text x="50%" y="55%" text-anchor="middle"
                font-family="Arial, Helvetica, sans-serif"
                font-size="140" font-weight="bold">
            <tspan fill="#2E7D32">Cook</tspan>
            <tspan fill="#C9A227">vibe</tspan>
          </text>
        </svg>
      </div>
      <div>
        <h1>CookVibe</h1>
        <p>CookVibe demo is live — help shape it.</p>
      </div>
    </div>

    <div class="badges">
      <span class="badge">🌍 Global food culture</span>
      <span class="badge">📸 Meals & 🎥 Videos</span>
      <span class="badge">🧪 Stage 1 demo</span>
    </div>
  </div>

  <!-- Global food + people collage -->
  <div class="collage">
    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=900&q=70">
    <img src="https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=900&q=70">
    <img src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?auto=format&fit=crop&w=900&q=70">
    <img src="https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=900&q=70">
  </div>

  <div class="form">
    <input id="code" placeholder="Enter access code (FOUNDING20 / ADMIN / creator code)">
    <button class="primary" id="enter">Enter CookVibe</button>
  </div>

  <div class="form">
    <button class="secondary" id="viewer">Continue as Viewer</button>
    <button class="secondary" id="reset">Reset Access</button>
  </div>

  <div class="note">
    FOUNDING20 = Founding Creator • ADMIN = Admin • Any other code = Creator
  </div>
</div>

<div class="mum-note">I love you Mum thank you.</div>

<script>
const LS={role:"cv_role",admin:"cv_admin",founding:"cv_founding"};
const toast=(m)=>{const t=document.getElementById("toast");t.textContent=m;t.className="toast show";setTimeout(()=>t.className="toast",1800);};

(function autoSkip(){
  let r=localStorage.getItem(LS.role)||"viewer";
  if(localStorage.getItem(LS.admin)==="1") r="admin";
  if(localStorage.getItem(LS.founding)==="1") r="founder_creator";
  if(r!=="viewer"){ location.href="app.html#studio"; }
})();

function applyCode(raw){
  const c=(raw||"").trim().toUpperCase();
  let r="viewer";
  if(c==="ADMIN"){r="admin";localStorage.setItem(LS.admin,"1");localStorage.removeItem(LS.founding);}
  else if(c==="FOUNDING20"){r="founder_creator";localStorage.setItem(LS.founding,"1");localStorage.removeItem(LS.admin);}
  else if(c){r="creator";localStorage.removeItem(LS.admin);localStorage.removeItem(LS.founding);}
  else{localStorage.removeItem(LS.admin);localStorage.removeItem(LS.founding);}
  localStorage.setItem(LS.role,r);
  return r;
}

document.getElementById("enter").onclick=()=>{
  const r=applyCode(document.getElementById("code").value);
  toast("Access granted");
  location.href = r==="viewer" ? "app.html#earn" : "app.html#studio";
};

document.getElementById("viewer").onclick=()=>{
  applyCode("");
  toast("Viewer mode");
  location.href="app.html#earn";
};

document.getElementById("reset").onclick=()=>{
  Object.values(LS).forEach(k=>localStorage.removeItem(k));
  toast("Access reset");
};
</script>
</body>
</html>
