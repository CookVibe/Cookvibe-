<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CookVibe • Access</title>
<meta http-equiv="Cache-Control" content="no-store"/>

<style>
:root{
  --g:#1fbf7a;
  --y:#d9b75f;
  --text:#121212;
  --muted:#55635e;
  --line:rgba(0,0,0,.10);
  --shadow:0 14px 34px rgba(0,0,0,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  color:var(--text);
  background:
    radial-gradient(1200px 700px at 10% 0%, rgba(255,186,73,.28), transparent 55%),
    radial-gradient(1100px 700px at 90% 5%, rgba(31,191,122,.20), transparent 55%),
    linear-gradient(180deg,#fff6e6 0%,#ffffff 60%,#f5fff9 100%);
}

/* -------------------------
   DINNER PLATE SCENE (NEW)
   Pure CSS/HTML (no images)
------------------------- */
.stage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 14px 60px;
  position:relative;
  overflow:hidden;
}
.plateScene{
  width:min(1080px, 96vw);
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 10px;
}
.plate{
  width:min(920px, 96vw);
  aspect-ratio: 1 / 1;
  border-radius:999px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  filter: drop-shadow(0 28px 60px rgba(0,0,0,.14));
}
/* plate layers */
.plate::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:999px;
  background:
    radial-gradient(circle at 50% 45%, rgba(255,255,255,.96) 0 38%,
      rgba(240,240,240,.96) 38% 58%,
      rgba(225,225,225,.96) 58% 70%,
      rgba(245,245,245,.96) 70% 100%);
  border:1px solid rgba(0,0,0,.10);
}
.plate::after{
  /* inner shine */
  content:"";
  position:absolute;
  inset:18%;
  border-radius:999px;
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,.85), rgba(255,255,255,0) 60%),
    radial-gradient(circle at 70% 75%, rgba(0,0,0,.06), rgba(0,0,0,0) 55%);
  pointer-events:none;
}

/* utensils */
.utensil{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:120px;
  height:72%;
  opacity:.92;
  filter: drop-shadow(0 10px 18px rgba(0,0,0,.10));
}
.utensil.left{left:0}
.utensil.right{right:0; transform:translateY(-50%) scaleX(-1);}

.utensil .handle{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  width:26px;
  height:64%;
  border-radius:22px;
  background:linear-gradient(180deg, rgba(210,210,210,.95), rgba(165,165,165,.95));
  border:1px solid rgba(0,0,0,.10);
}
.utensil .neck{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:64%;
  width:36px;
  height:10%;
  border-radius:18px;
  background:linear-gradient(180deg, rgba(230,230,230,.95), rgba(180,180,180,.95));
  border:1px solid rgba(0,0,0,.10);
}
.utensil .head{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:0;
  width:56px;
  height:28%;
  border-radius:18px;
  background:linear-gradient(180deg, rgba(245,245,245,.96), rgba(190,190,190,.96));
  border:1px solid rgba(0,0,0,.10);
}

/* fork prongs */
.utensil .prongs{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:10px;
  width:46px;
  height:24%;
  display:flex;
  gap:5px;
  justify-content:center;
}
.utensil .prongs span{
  display:block;
  width:6px;
  height:100%;
  border-radius:6px;
  background:linear-gradient(180deg, rgba(245,245,245,.96), rgba(170,170,170,.96));
  border:1px solid rgba(0,0,0,.10);
}

/* knife blade (on the right utensil via :after) */
.utensil.right .head{
  border-radius:18px 18px 10px 10px;
}
.utensil.right .head::after{
  content:"";
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:8px;
  width:18px;
  height:78%;
  border-radius:14px;
  background:linear-gradient(180deg, rgba(250,250,250,.98), rgba(165,165,165,.95));
  border:1px solid rgba(0,0,0,.10);
}

/* center content sits on the plate */
.center{
  position:relative;
  width:min(780px, 90vw);
  z-index:3;
}

/* -------------------------
   EXISTING PAGE STYLES
------------------------- */
.wrap{max-width:1100px;margin:0 auto}
.card{
  background:rgba(255,255,255,.94);
  border:1px solid var(--line);
  border-radius:24px;
  padding:22px;
  box-shadow:var(--shadow);
}
.row{display:flex;gap:14px;align-items:center}
.small{font-size:12px;color:var(--muted)}
.btn{
  padding:12px 18px;border-radius:14px;border:0;
  cursor:pointer;font-weight:900;
  background:linear-gradient(135deg,var(--g),var(--y));
  color:#fff; /* ✅ white text as requested */
}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc}

.logoBox{
  width:60px;height:60px;border-radius:18px;
  border:1px solid rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;
  background:#000;
}
.logoBox img{
  width:50px;height:50px;object-fit:contain;display:block;
}

.foodGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-top:16px;
}
.foodGrid img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:16px;
  border:1px solid rgba(0,0,0,.10);
}
.earn{
  margin-top:18px;
  border-radius:18px;
  padding:16px;
  background:rgba(31,191,122,.08);
  border:1px solid rgba(31,191,122,.25);
}

/* mobile tighten utensils */
@media(max-width:820px){
  .utensil{width:84px}
}
@media(max-width:520px){
  .utensil{display:none} /* keep it clean on very small screens */
  .plate::before{inset:0}
  .plate{width:min(980px, 96vw)}
}
</style>
</head>

<body>
  <div class="stage">
    <div class="plateScene">

      <!-- Fork (left) -->
      <div class="utensil left" aria-hidden="true">
        <div class="head"></div>
        <div class="prongs">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="neck"></div>
        <div class="handle"></div>
      </div>

      <!-- Knife (right) -->
      <div class="utensil right" aria-hidden="true">
        <div class="head"></div>
        <div class="neck"></div>
        <div class="handle"></div>
      </div>

      <!-- Plate -->
      <div class="plate" aria-hidden="true"></div>

      <!-- EXISTING CONTENT (UNCHANGED) -->
      <div class="center">
        <div class="wrap">
          <div class="card">

            <div class="row">
              <div class="logoBox">
                <!-- IMPORTANT: place your logo file beside index.html named cookvibe-logo.png -->
                <img src="cookvibe-logo.png" alt="CookVibe logo">
              </div>
              <div>
                <!-- CookVibe styled like logo -->
                <div style="font-weight:1000; font-size:20px; letter-spacing:.2px">
                  <span style="color:#2E7D32">Cook</span><span style="color:#C9A227">vibe</span>
                </div>
                <div class="small">Access required</div>
              </div>
            </div>

            <h1>CookVibe demo is live — help shape it.</h1>
            <p>A global cooking platform built for creators.</p>

            <!-- FOOD ONLY (IMAGES THAT WORK) -->
            <div class="foodGrid">
              <!-- Seafood (ONE) -->
              <img src="https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=800&q=80" alt="Seafood">

              <!-- Meals -->
              <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=800&q=80" alt="Paella">
              <img src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?auto=format&fit=crop&w=800&q=80" alt="Salad">
              <img src="https://images.unsplash.com/photo-1551218808-94e220e084d2?auto=format&fit=crop&w=800&q=80" alt="Sushi">
            </div>

            <div class="earn">
              <strong>How creators earn</strong>
              <ul>
                <li>Tips during live cooking</li>
                <li>Future subscriptions</li>
                <li>Early creator rewards</li>
              </ul>
            </div>

            <!-- ACCESS -->
            <div style="margin-top:18px">
              <input id="code" placeholder="Enter access code"/>
              <div style="margin-top:12px">
                <button class="btn" onclick="enter()">Enter CookVibe</button>
              </div>
            </div>

          </div>
        </div>
      </div>

    </div>
  </div>

<script>
function enter(){
  const raw = document.getElementById("code").value || "";
  const code = raw.trim().toUpperCase();

  // ✅ single dev access code (change this string if you want a different one)
  const DEV_ACCESS_CODE = "CORECIRCLE";

  if(!code){
    alert("Enter an access code");
    return;
  }

  // ❌ block everything except the dev code
  if(code !== DEV_ACCESS_CODE){
    alert("Invalid access code.");
    return;
  }

  // clear all roles first
  localStorage.removeItem("cv_role");
  localStorage.removeItem("cv_admin");
  localStorage.removeItem("cv_founding");

  // ✅ give dev full access
  localStorage.setItem("cv_role","admin");
  localStorage.setItem("cv_admin","1");

  // hard redirect into app
  window.location.href = "app.html";
}
</script>

</body>
</html>
