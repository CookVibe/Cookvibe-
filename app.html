<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CookVibe • Demo</title>

<style>
:root{
  --g:#1fbf7a;
  --y:#d9b75f;
  --bg1:#fff3e0;
  --bg2:#ffffff;
  --text:#222;
  --muted:#666;
  --card:#ffffff;
  --line:#e6e6e6;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial;
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  color:var(--text);
}

a{text-decoration:none;color:inherit}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:20px;
}

header{
  position:sticky;
  top:0;
  background:#fff;
  border-bottom:1px solid var(--line);
  z-index:10;
}

.header-inner{
  max-width:1100px;
  margin:0 auto;
  padding:12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo svg{height:36px}

nav a{
  margin-left:12px;
  font-weight:700;
}

.btn{
  padding:10px 16px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  font-weight:900;
  background:linear-gradient(135deg,var(--g),var(--y));
  color:#000;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 28px rgba(0,0,0,.08);
  margin-bottom:20px;
}

/* ACCESS PAGE */
#access{
  text-align:center;
}

#access input{
  padding:12px;
  width:260px;
  max-width:100%;
  border-radius:12px;
  border:1px solid var(--line);
  font-size:16px;
}

/* POST ACCESS HERO */
.hero{
  margin-top:10px;
}

.hero h1{
  font-size:28px;
  margin-bottom:6px;
}

.hero p{
  color:var(--muted);
}

/* GALLERY */
.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:12px;
  margin-top:16px;
}

.gItem img{
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:14px;
  display:block;
}

/* MUM EASTER EGG */
.mum-note{
  position:fixed;
  right:12px;
  bottom:10px;
  font-size:11px;
  opacity:.15;
  pointer-events:none;
}

@media(max-width:1200px){
  .mum-note{display:none}
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <svg width="160" viewBox="0 0 500 200">
        <text x="0" y="140" font-size="140" font-weight="900" font-family="Arial">
          <tspan fill="#2E7D32">Cook</tspan>
          <tspan fill="#C9A227">vibe</tspan>
        </text>
      </svg>
    </div>
    <nav>
      <a href="#access">Access</a>
      <a href="#app">App</a>
    </nav>
  </div>
</header>

<div class="wrap">

  <!-- ACCESS -->
  <section id="access" class="card">
    <h2>Welcome to CookVibe 🌍</h2>
    <p>A global cooking community where creators earn through engagement.</p>
    <input id="code" placeholder="Enter access code"/>
    <div style="margin-top:14px">
      <button class="btn" onclick="unlock()">Enter</button>
    </div>
  </section>

  <!-- APP -->
  <section id="app" class="card hero" style="display:none">
    <h1>Welcome to CookVibe 🍽️</h1>
    <p>Creators • Culture • Community • Earnings</p>

    <div class="gallery">
      <div class="gItem"><img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836"></div>
      <div class="gItem"><img src="https://images.unsplash.com/photo-1525351484163-7529414344d8"></div>
      <div class="gItem"><img src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe"></div>
      <div class="gItem"><img src="https://images.unsplash.com/photo-1606787366850-de6330128bfc"></div>
      <div class="gItem"><img src="https://images.unsplash.com/photo-1604908554160-6e75a3fba9d1"></div>
      <div class="gItem"><img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd"></div>
    </div>

    <p style="margin-top:20px">
      Upload meals. Share videos. Go live. Earn as your audience grows.
    </p>
  </section>

</div>

<div class="mum-note">I love you Mum thank you.</div>

<script>
function unlock(){
  document.getElementById("access").style.display="none";
  document.getElementById("app").style.display="block";
  location.hash="#app";
}
</script>

</body>
</html>
